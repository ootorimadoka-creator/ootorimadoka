<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>皇鳥まどかのツール置き場</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#1d2433;--sub:#6b7488;--line:#d5dbe6;--accent:#3d5afe;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0f141c;--card:#171e29;--ink:#e6ebf4;--sub:#93a0b5;--line:#2b3544;--accent:#7ea2ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;line-height:1.6;padding:32px 16px 56px}
main{max-width:560px;margin:0 auto}
h1{font-size:24px;margin:0 0 4px}
.lead{margin:0 0 24px;color:var(--sub);font-size:14px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;color:inherit;text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--accent);outline:none}
.t{font-weight:700;font-size:17px;color:var(--accent)}
.d{margin:2px 0 0;font-size:13px;color:var(--sub)}
footer{margin-top:28px;font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<main>
  <h1>皇鳥まどかのツール置き場</h1>
  <p class="lead">ブラウザだけで使える自作ツールです。画像や音声は端末の外には送られません。</p>
  <ul>
    <li><a class="card" href="tools/screenshot-stitcher.html"><div class="t">スクショつなぎ</div><p class="d">スクショを並べて、つなぎ目を調整し、1枚の縦長画像にします。</p></a></li>
    <li><a class="card" href="tools/redactor.html"><div class="t">スクショ黒塗りツール</div><p class="d">文字を認識して、指定した言葉を黒塗り・モザイクにします。</p></a></li>
    <li><a class="card" href="tools/%E5%91%BC%E5%90%B8%E3%81%A8%E5%BF%83%E6%8B%8D.html"><div class="t">呼吸と心拍</div><p class="d">呼吸と心拍のテンポを合わせた環境音を流します。</p></a></li>
    <li><a class="card" href="tools/MP3%E3%82%A8%E3%83%87%E3%82%A3%E3%82%BF.html"><div class="t">MP3エディタ</div><p class="d">カット・伏せる・重ねるができるMP3編集ツールです。</p></a></li>
  </ul>
</main>
</body>
</html>
